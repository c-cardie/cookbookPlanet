    <script src="../JavaScripts/index_script.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const openTimerBtn = document.getElementById("openTimerBtn");
        const closeTimerBtn = document.getElementById("closeTimerBtn");
        const floatingTimer = document.getElementById("floatingTimer");

        if (openTimerBtn && closeTimerBtn && floatingTimer) {
          openTimerBtn.addEventListener("click", () => {
            floatingTimer.style.display = "block";
          });

          closeTimerBtn.addEventListener("click", () => {
            floatingTimer.style.display = "none";
          });
        }
      });

      let countdown;
      let alarmSound = new Audio("https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg");

      function startTimer() {
        const hours = parseInt(document.getElementById('hours').value) || 0;
        const minutes = parseInt(document.getElementById('minutes').value) || 0;
        const seconds = parseInt(document.getElementById('seconds').value) || 0;

        let totalSeconds = hours * 3600 + minutes * 60 + seconds;
        if (totalSeconds <= 0) return;

        updateDisplay(totalSeconds);
        clearInterval(countdown);

        countdown = setInterval(() => {
          totalSeconds--;
          updateDisplay(totalSeconds);
          if (totalSeconds <= 0) {
            clearInterval(countdown);
            alarmSound.loop = true;
            alarmSound.play();
          }
        }, 1000);
      }

      function resetTimer() {
        clearInterval(countdown);
        document.getElementById('timerDisplay').textContent = '00:00:00';
        alarmSound.pause();
        alarmSound.currentTime = 0;
      }

      function updateDisplay(seconds) {
        const hr = String(Math.floor(seconds / 3600)).padStart(2, '0');
        const min = String(Math.floor((seconds % 3600) / 60)).padStart(2, '0');
        const sec = String(seconds % 60).padStart(2, '0');
        document.getElementById('timerDisplay').textContent = `${hr}:${min}:${sec}`;
      }
    </script>
